# candidates.yaml — elementary overlay candidates for the review page
# (`make review`, then open /review). Each item proposes replacing a monochrome
# telementary action icon with elementary's full-color art. Decisions made on
# the review page land in review/decisions.md.
#
# Scope: names the theme serves from actions/ whose 16/22/24 art is a
# monochrome glyph (Tela) — or that the theme lacks, so KDE falls back to
# Breeze's monochrome icon — and that elementary ships as non-symbolic art
# (kind: same-name); plus common KDE action names elementary does not ship,
# paired with a hand-picked elementary icon (kind: substitute). Names already
# published by an overlays/**/overlay.yaml are left out.
#
# Fields per item:
#   id        the theme icon name under review (unique)
#   group     display grouping on the review page
#   kind      same-name | substitute
#   source    elementary icon name the art comes from
#   category  target theme context
#   usage     how many installed KDE/Qt components reference the name (a
#             strings(1) scan of binaries, plugins and QML — a hint only)
#   used_by   a sample of those components
#   links     the proposed overlay, in overlay.yaml terms: `from` is the
#             elementary source (relative to the elementary theme root, the
#             path as listed — it may be a symlink), `names` the theme names
#             it publishes, `sizes` the buckets (the first is the real copy).
#             22 has no elementary art, so it reuses the nearest size (24).
#   notes     things to look at before deciding
#
# How it was built (2026-09-26, one-off script, not in the repo): the generated
# output/ (vendored Tela + overlays) was scanned and each icon's 16/22/24 SVG
# classified by its paints (currentColor or plain grays = monochrome);
# elementary's numeric art was matched by name across its contexts, symlinked
# names included. Buckets: 16/24/32/48 from the same elementary size, 22 from
# 24, and a missing size from the nearest one (larger on a tie); symbolic from
# elementary's -symbolic glyph, -rtl variants folded into their base item.
# usage/used_by come from strings(1) over Qt/KDE binaries in /usr/bin, the KF6
# and KDE libraries, Qt plugins and KDE QML. Edit by hand to add, drop or
# re-map items — the review page re-reads this file on every request.

