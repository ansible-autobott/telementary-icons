# overlay.yaml — STAGED design set: NOT applied to the theme. `make theme`
# reads only overlays/, so nothing here ships; move a block (and its SVGs)
# into the matching overlays/actions/dialogs-system/ set once the art is ready.
# See overlays/apps/smb4k/overlay.yaml for the full field reference.
#
# dialogs-system — actions. The rejected items of the "Dialogs & system" group of the
# elementary overlay review (review/decisions.md, `make review`), staged here
# to be reworked by hand: configure, system-run, help-about, tab-close, configure-shortcuts, notification-disabled.
#
# The other tab actions were added next to tab-close so the whole family is
# reworked together (they were not in the review): tab-close-other,
# tab-duplicate, tab-detach, tab-new-background and the tab-* symbolics.
# elementary has no tab art beyond tab-new-symbolic, so each borrows the
# nearest elementary icon, noted per block.
#
# The art is the review's proposal, prepared like the shipped sets: elementary's
# (GPL-3.0) after a single svgo pass, `from` is the file an elementary symlink
# resolves to, and the first size in `sizes` is the real copy (elementary ships
# no 22, so 24 serves it). Every icon has its own SVGs, so they can diverge.
# The *-symbolic.svg files are recolored from GNOME's `url(#gpa:foreground)` to
# the ColorScheme-Text / currentColor pattern (see overlays/README.md).

set: dialogs-system

origin:
  theme: elementary

links:
  # --- configure ---
  # elementary's preferences-system gear.
  - src: configure-16.svg
    from: categories/16/preferences-system.svg
    category: actions
    names: [configure]
    sizes: [16]
