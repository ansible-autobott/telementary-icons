name: "telementary-icons"
arch: "all"
platform: "linux"
version: "${VERSION}"
# Debian package revision (the part after the dash). Kept separate from
# ${VERSION} so a "same upstream version, new build" tag like v0.1.0-1 renders
# as the Debian revision 0.1.0-1 (which sorts ABOVE 0.1.0). Putting the -1 in
# ${VERSION} instead makes nfpm's semver parser treat it as a pre-release and
# emit 0.1.0~1 (which sorts BELOW 0.1.0). Empty for a plain vX.Y.Z tag.
release: "${RELEASE}"
section: "default"
priority: "optional"

# Breeze is the inheritance fallback (Inherits=Breeze) for any icon this theme
# does not provide, so recommend its icon set.
recommends:
- breeze-icon-theme

maintainer: "Andres Bott <contact@andresbott.com>"
description: |
  Telementary — custom KDE icon theme based on Tela and elementary.
license: "Mixed"

# nfpm `contents:` is the single source of truth for what ships and where.
contents:
# the generated freedesktop icon theme (rebuilt by `make theme` into ./output);
# installs under the theme id "telementary"
- src: ./output
  dst: /usr/share/icons/telementary

# vendored Tela icon theme license + attribution (GPL-3.0)
- src: ./tela-icons/COPYING
  dst: /usr/share/doc/telementary-icons/Tela-COPYING
- src: ./tela-icons/AUTHORS
  dst: /usr/share/doc/telementary-icons/Tela-AUTHORS
