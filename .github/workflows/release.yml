name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Surfaced as a job env var so the registration step can gate on it in
      # `if:` (secrets can't be referenced in `if:` directly). Empty when the
      # secret isn't configured — the release still publishes, only the APT-repo
      # registration is skipped.
      DEBIAN_REPO_TOKEN: ${{ secrets.DEBIAN_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version + release from tag
        # v0.1.0   -> VERSION=0.1.0  RELEASE=      (plain release)
        # v0.1.0-1 -> VERSION=0.1.0  RELEASE=1     (Debian revision -> nfpm emits 0.1.0-1)
        # The dash suffix is the Debian package revision, not a version suffix:
        # it must stay out of ${VERSION}, or nfpm's semver parser turns it into a
        # pre-release "~" that sorts BELOW the plain version. nfpm reads both
        # ${VERSION} and ${RELEASE} from nfpm.yaml.
        run: |
          ref="${GITHUB_REF_NAME#v}"
          echo "VERSION=${ref%%-*}" >> "$GITHUB_ENV"
          case "$ref" in
            *-*) echo "RELEASE=${ref#*-}" >> "$GITHUB_ENV" ;;
            *)   echo "RELEASE=" >> "$GITHUB_ENV" ;;
          esac

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      - name: Build .deb
        run: make build

      - name: Stage .deb under dist/
        # nfpm writes the .deb to the repo root; move it under dist/ so the
        # register action finds it as a flat, release-agnostic ("any") artifact.
        run: |
          mkdir -p dist
          mv *.deb dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*.deb'
          generate_release_notes: true

      - name: Register in the autobott APT repo
        # Commits a packages/telementary-icons.json reference (version + sha256 +
        # the release asset URL) to ansible-autobott/debian-repo, which then
        # rebuilds and re-signs its APT index. The package is Architecture: all
        # and release-agnostic, so it registers as release "any" / arch "all" —
        # indexed into every configured suite and architecture.
        # Requires a DEBIAN_REPO_TOKEN secret (Contents: write on debian-repo);
        # skipped when it's absent so releases don't fail before it's set up.
        if: ${{ env.DEBIAN_REPO_TOKEN != '' }}
        uses: ansible-autobott/debian-repo/.github/actions/register@main
        with:
          name: telementary-icons          # must match the .deb's Package field
          dist-dir: dist                   # flat dist/*.deb => release "any"
          token: ${{ env.DEBIAN_REPO_TOKEN }}
