name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version + release from tag
        # v0.1.0   -> VERSION=0.1.0  RELEASE=      (plain release)
        # v0.1.0-1 -> VERSION=0.1.0  RELEASE=1     (Debian revision -> nfpm emits 0.1.0-1)
        # The dash suffix is the Debian package revision, not a version suffix:
        # it must stay out of ${VERSION}, or nfpm's semver parser turns it into a
        # pre-release "~" that sorts BELOW the plain version. nfpm reads both
        # ${VERSION} and ${RELEASE} from nfpm.yaml.
        run: |
          ref="${GITHUB_REF_NAME#v}"
          echo "VERSION=${ref%%-*}" >> "$GITHUB_ENV"
          case "$ref" in
            *-*) echo "RELEASE=${ref#*-}" >> "$GITHUB_ENV" ;;
            *)   echo "RELEASE=" >> "$GITHUB_ENV" ;;
          esac

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      - name: Build .deb
        run: make build

      - name: Stage .deb under dist/
        # nfpm writes the .deb to the repo root; move it under dist/ so the apt
        # job below gets it as a flat, release-agnostic ("any") artifact.
        run: |
          mkdir -p dist
          mv *.deb dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*.deb'
          generate_release_notes: true

      - name: Upload the .deb for the autobott APT repo
        # Hands the .deb to the apt job below. A flat dist/*.deb registers as
        # release "any": the package is Architecture: all and release-agnostic,
        # so it is indexed into every configured suite and architecture.
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error

  # Registers the release in ansible-autobott/debian-repo through the
  # gh-action-debian-repo engine: it commits a packages/telementary-icons.json
  # reference (version + sha256 + the release asset URL) there, which then
  # rebuilds and re-signs its APT index. The default GITHUB_TOKEN cannot push to
  # another repo, so the engine mints a short-lived token from the
  # ansible-autobott APT GitHub App (org variable APT_APP_ID + secret
  # APT_APP_PRIVATE_KEY), scoped to debian-repo. Skipped while APT_APP_ID is not
  # set, so releases don't fail before the App is set up.
  apt:
    needs: release
    if: ${{ vars.APT_APP_ID != '' }}
    permissions:
      contents: read
    uses: andresbott/gh-action-debian-repo/.github/workflows/publish.yml@v1
    with:
      name: telementary-icons          # must match the .deb's Package field
      artifact: debs
      collection: ansible-autobott/debian-repo
      app-id: ${{ vars.APT_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.APT_APP_PRIVATE_KEY }}
