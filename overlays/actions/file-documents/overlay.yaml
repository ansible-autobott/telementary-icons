# overlay.yaml — applies this design set into the icon theme via `make theme`.
# See overlays/apps/smb4k/overlay.yaml for the full field reference.
#
# file-documents — actions. The "File & documents" group of the elementary
# overlay review (review/decisions.md, `make review`), one block per approved
# icon.
#
# File and document actions: New, Open, Open Folder, Save / Save As / Revert,
# Print / Print Preview / Page Setup, Properties, Export / Import, and the "new"
# actions (window, tab, bookmark, tag, appointment, address book, contact,
# database, folder), plus folder copy/move, folder-tag, send-to and Move to
# Trash.
#
# Artwork is elementary's (GPL-3.0, same license as the vendored Tela base) and
# replaces the monochrome Tela glyph (or the Breeze fallback) under each name.
# Numeric sizes are elementary's art after a single svgo pass. elementary ships
# no 22, so the 24 art also serves 22, and a size it lacks is covered by the
# nearest one it has (the first size in `sizes` is the real copy). Where
# elementary's name is a symlink, `from` is the file it resolves to, and names
# that share art share one source SVG.
#
# The *-symbolic.svg files are not verbatim copies: elementary paints them with
# GNOME's `url(#gpa:foreground)`, which KDE cannot recolor, so after the same
# svgo pass the fill was swapped for this repo's ColorScheme-Text /
# currentColor pattern (see overlays/README.md), and a viewBox was added where
# it was missing so they scale in the symbolic bucket.
#
# NOTE: the numeric art is full-color and does NOT follow the KDE color scheme;
# only the symbolic bucket recolors. Tela ships many legacy names as symlinks
# onto the files replaced here, so those switch to this art too (see
# review/decisions.md, each task's "also changes" line).
#
# Recolored per the review comments: the folder in folder-new, folder-open /
# document-open-folder, folder-copy, folder-move and document-save-as is
# elementary's tan folder turned into the theme's blue, with the same map as
# places/folder-types (#efdfc4 -> #b4cee1, #e7c591 -> #5d9fcd, #b6802e ->
# #3c7caa, #987124 -> #3c6480). The rest of those icons (paper, the green
# arrow and plus badge) is unchanged.
#
# Substitutes, where elementary has no art under the KDE name:
# document-open-folder uses folder-open (elementary's own document-open links
# there), tab-new uses window-new, and trash-empty uses user-trash — the same
# art as the places/trash set.
#
# document-open is the exception: rejected in the review (elementary's is the
# same folder-open art as document-open-folder), then reworked in staged/. It
# is elementary's document-save flipped by hand, so the green arrow points up,
# out of the tray: the counterpart of Save. Each size (and the symbolic, still
# ColorScheme-Text) is the matching document-save flipped, after the same svgo
# pass.

set: file-documents

origin:
  theme: elementary

