# overlay.yaml — applies this design set into the icon theme via `make theme`.
# See overlays/apps/smb4k/overlay.yaml for the full field reference.
#
# navigation — actions. Dolphin's toolbar navigation buttons: Back, Forward,
# Up, Down, and Home.
#
# go-previous / go-next / go-up / go-down: the numeric buckets (16/24/32/48) are
# elementary's full-color art copied verbatim (GPL-3.0, same license as the
# vendored Tela base) — each size is distinct art. elementary ships no 22, so
# the 24 art also serves the 22 bucket (Dolphin's default toolbar size). The
# symbolic bucket is elementary's symbolic glyph recolored from GNOME's
# `url(#gpa:foreground)` to this repo's ColorScheme-Text / currentColor pattern
# (see overlays/README.md) so it follows the active color scheme.
#
# NOTE: the numeric arrows are full-color and do NOT follow the KDE color
# scheme (that is elementary's artwork); only the symbolic bucket recolors.
#
# go-home: elementary's actions/go-home is a symlink to places/user-home, so the
# numeric buckets (16/24/32/48; 22 via the 24 art) are that full-color house art
# copied verbatim, and the symbolic bucket is recolored to ColorScheme-Text.

set: navigation

origin:
  theme: elementary

links:
  # --- go-previous (Back) — verbatim elementary numeric, recolored symbolic ---
  - src: go-previous-16.svg
    from: actions/16/go-previous.svg
    category: actions
    names: [go-previous]
    sizes: [16]
  - src: go-previous-24.svg
    from: actions/24/go-previous.svg
    category: actions
    names: [go-previous]
    sizes: [24, 22]
  - src: go-previous-32.svg
