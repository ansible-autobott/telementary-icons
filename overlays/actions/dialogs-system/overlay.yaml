# overlay.yaml — applies this design set into the icon theme via `make theme`.
# See overlays/apps/smb4k/overlay.yaml for the full field reference.
#
# dialogs-system — actions. The "Dialogs & system" group of the elementary
# overlay review (review/decisions.md, `make review`), one block per approved
# icon.
#
# Dialog buttons and message icons (OK / Apply, Cancel, information, warning,
# error, password), help, and the session / system actions (lock screen, log
# out, reboot / restart, shut down, suspend, search), plus the starred and
# on / off state icons, applications-other and x-office-address-book.
#
# Artwork is elementary's (GPL-3.0, same license as the vendored Tela base) and
# replaces the monochrome Tela glyph (or the Breeze fallback) under each name.
# Numeric sizes are elementary's art after a single svgo pass. elementary ships
# no 22, so the 24 art also serves 22, and a size it lacks is covered by the
# nearest one it has (the first size in `sizes` is the real copy). Where
# elementary's name is a symlink, `from` is the file it resolves to, and names
# that share art share one source SVG.
#
# The *-symbolic.svg files are not verbatim copies: elementary paints them with
# GNOME's `url(#gpa:foreground)`, which KDE cannot recolor, so after the same
# svgo pass the fill was swapped for this repo's ColorScheme-Text /
# currentColor pattern (see overlays/README.md), and a viewBox was added where
# it was missing so they scale in the symbolic bucket.
#
# NOTE: the numeric art is full-color and does NOT follow the KDE color scheme;
# only the symbolic bucket recolors. Tela ships many legacy names as symlinks
# onto the files replaced here, so those switch to this art too (see
# review/decisions.md, each task's "also changes" line).
#
# Shared art, where elementary has no art under the KDE name or links it:
#   dialog-cancel, off, off-outline -> process-stop
#   dialog-ok-apply, on, on-outline -> process-completed (dialog-ok and
#                                      dialog-apply are Tela aliases of it)
#   help-contents -> system-help      gnome-lockscreen -> system-lock-screen
#   system-search -> edit-find        jockey-proprietary -> locked
#   system-restart -> view-refresh at 16/22/24, system-reboot at 32/48
# Tela aliases dialog-cancel onto window-close; the dialog-cancel links here
# give Cancel buttons their own art without touching window-close.
#
# Symbolic colors: dialog-warning, starred and semi-starred are painted with
# GNOME's `gpa:warning`, dialog-error with `gpa:error`. They map to KDE's
# ColorScheme-NeutralText / ColorScheme-NegativeText instead of
# ColorScheme-Text, so they keep their warning / error color and still follow
# the color scheme.

set: dialogs-system

origin:
  theme: elementary

