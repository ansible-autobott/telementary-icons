<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
 <!-- Tela brand-app tile (matches scalable/apps/protonvpn.svg): light rounded card -->
 <rect x="6" y="6" width="52" height="52" rx="8" ry="8" fill="#f4f2f8" style="paint-order:stroke fill markers"/>
 <!-- GlobalProtect globe: flat cyan disc + white wireframe grid -->
 <circle cx="26" cy="28" r="16" fill="#38c1e6"/>
 <g fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".85">
  <ellipse cx="26" cy="28" rx="16" ry="8"/>
  <ellipse cx="26" cy="28" rx="8" ry="16"/>
  <path d="M10 28h32"/>
  <path d="M26 12v32"/>
 </g>
 <!-- Dark shield, bottom-right; tile-colored outline cuts it cleanly off the globe -->
 <path fill="#24365d" stroke="#f4f2f8" stroke-width="1.8"
       d="M38 34h14q2 0 2 2v7c0 6.5-4 10-9 12.5-5-2.5-9-6-9-12.5v-7q0-2 2-2z"/>
