    sizes: [16, 24, 32, 64]

  - src: image-x-generic.svg
    from: scalable/mimetypes/image-x-generic.svg
    category: mimetypes
    names: [image-x-generic]
    sizes: [16, 24, 32, 64]

  - src: image-x-krita.svg
    from: scalable/mimetypes/image-x-krita.svg
    category: mimetypes
