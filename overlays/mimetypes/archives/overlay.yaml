# overlay.yaml — applies this design set into the icon theme via `make theme`.
# See overlays/apps/smb4k/overlay.yaml for the full field reference.
#
# Compressed / archive mimetype icons imported from the Tela icon theme
# (per-format artwork). Each Tela source is a single scalable SVG; here it is
# published into the theme's mimetypes buckets (16/24/32/64): the first size is
# a real copy, the rest are relative symlinks to it. Source filename == the
# freedesktop icon name it maps to.
#
# The older ark-zip set (a single generic package-x-generic icon) is disabled
# in favour of these — package-x-generic below comes from Tela instead.

set: archives

origin:
  theme: Tela

links:
  - src: application-zip.svg
    from: scalable/mimetypes/application-zip.svg
    category: mimetypes
    names: [application-zip]
    sizes: [16, 24, 32, 64]

  - src: application-x-7z-compressed.svg
    from: scalable/mimetypes/application-x-7z-compressed.svg
    category: mimetypes
    names: [application-x-7z-compressed]
    sizes: [16, 24, 32, 64]

  - src: application-x-tar.svg
    from: scalable/mimetypes/application-x-tar.svg
