# overlay.yaml — applies this design set into the icon theme via `make theme`.
# See overlays/apps/smb4k/overlay.yaml for the full field reference.
#
# folder-types — places. The base directory icon (folder) plus the decorated
# XDG folder icons: Documents, Pictures, Music, Videos, Downloads. Artwork is
# sourced from the elementary icon theme (GPL-3.0, same license as the vendored
# Tela base) and recolored from elementary's orange palette to the theme's blue
# tones (matching folder-open-recent). Each size is distinct art, so each gets
# its own source file and its own link.
#
# These cover TWO rows each in Dolphin's sidebar. The real bookmarks use
# folder-documents / folder-pictures / folder-music / folder-videos /
# folder-download, while the "Search For" section uses a different set of names
# for the same concepts — folder-text, folder-images, folder-sound,
# folder-videos. Both sets are published from the same art here, so one set
# covers the bookmark and its search twin. (Source: ~/.local/share/user-places.xbel
# is what names the icon for each sidebar row.)
#
# Names are listed explicitly rather than relying on Tela's chaining. Tela links
# these into non-obvious chains that differ by size — e.g. folder-text ->
# folder-txt -> folder-documents at 16, but folder-text -> folder-txt ->
# default-folder-documents at scalable, so overlaying only the canonical name
# would leave the search alias on Tela art at some sizes.
#
# Missing sizes are filled from the closest available source:
#   * no 22 in elementary -> the 24 art serves both 22 and 24.
#   * no 128 bucket in the theme -> elementary's 128 art is the scalable entry.
#
# The *-symbolic.svg files are the only ones that are not verbatim copies:
# elementary paints them with GNOME's `url(#gpa:foreground)`, which KDE cannot
# recolor, so the fill was swapped for this repo's ColorScheme-Text /
# currentColor pattern (see overlays/README.md). Path data is unchanged; a
# viewBox was added so they scale in the symbolic bucket.
#
# NOT included: elementary's *-open variants (folder-documents-open etc., at
# 32/48/64/128). Nothing in the sidebar uses them.

set: folder-types

origin:
  theme: elementary

links:
  # --- Base folder (generic directory icon) --------------------------------
  # The plain directory icon Dolphin/KIO uses for any folder. Same elementary
  # art + blue recolor as the typed folders below; elementary has no 22px, so
  # the 24 art serves both 22 and 24.
  - src: folder-16.svg
    from: places/16/folder.svg
    category: places
    names: [folder]
    sizes: [16]

  - src: folder-24.svg
    from: places/24/folder.svg
    category: places
    names: [folder]
    sizes: [24, 22]

  - src: folder-32.svg
    from: places/32/folder.svg
    category: places
    names: [folder]
    sizes: [32]

  - src: folder-48.svg
    from: places/48/folder.svg
    category: places
    names: [folder]
    sizes: [48]

  - src: folder-64.svg
    from: places/64/folder.svg
    category: places
    names: [folder]
    sizes: [64]

  - src: folder-128.svg
    from: places/128/folder.svg
    category: places
    names: [folder]
    sizes: [scalable]

  # --- Documents (bookmark: folder-documents, search: folder-text) ----------
  - src: folder-documents-16.svg
    from: places/16/folder-documents.svg
    category: places
    names: [folder-documents, folder-txt, folder-text]
