# overlay.yaml — applies this design set into the icon theme via `make overlay`.
# See icons/designs/apps/smb4k/overlay.yaml for the full field reference.
#
# folder — places. This is the icon Dolphin/KIO uses for a normal directory.
# Seeded from the apps/file-manager (system-file-manager) art so the directory
# icon matches it; intended to be heavily edited, so no origin/from provenance
# is recorded. Each size is distinct art -> its own copy. The 96/128 SVGs are
# kept as source but not applied (places uses 16/22/24/32/48/64).

set: folder

links:
  - src: folder-16.svg
    category: places
    names: [folder]
    sizes: [16]

  - src: folder-22.svg
    category: places
    names: [folder]
    sizes: [22]

  - src: folder-24.svg
    category: places
    names: [folder]
    sizes: [24]

  - src: folder-32.svg
    category: places
    names: [folder]
    sizes: [32]

  - src: folder-48.svg
    category: places
    names: [folder]
    sizes: [48]

  - src: folder-64.svg
    category: places
    names: [folder]
    sizes: [64]
